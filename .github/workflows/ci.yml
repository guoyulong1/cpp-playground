name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build (${{ matrix.compiler.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler libprotobuf-dev
          if [ "$CC" = "clang" ]; then sudo apt-get install -y clang; fi

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: Unit tests
        run: ctest --preset default

      - name: Run demos
        run: |
          ./build/default/fork_exec_demo
          ./build/default/raii_demo
          ./build/default/process_pool
          ./build/default/memory_optimization_demo
          ./build/default/algorithm_optimization_demo
          ./build/default/thread_pool_demo
          ./build/default/echo_server
          ./build/default/http_server
          ./build/default/serialization_benchmark
          ./build/default/zmq_patterns_demo

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy

      - name: Configure (generate compile_commands.json)
        run: cmake --preset default

      - name: Run clang-tidy on all sources
        run: |
          mapfile -t files < <(find src tests -name '*.cpp' | sort)
          clang-tidy -p build/default --quiet "${files[@]}" 2>&1 | tee tidy.log

      - name: Report
        run: |
          warnings=$(grep -c 'warning:' tidy.log || true)
          echo "clang-tidy 报告了 $warnings 个警告（详见上方日志）"
          # 练习：想让 CI 对警告零容忍，取消下面两行注释
          # if [ "$warnings" -ne 0 ]; then exit 1; fi

  sanitize:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler libprotobuf-dev

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Unit tests (sanitized)
        run: ctest --preset asan

      - name: Run demos (sanitized)
        run: |
          ./build/asan/fork_exec_demo
          ./build/asan/raii_demo
          ./build/asan/process_pool
          ./build/asan/memory_optimization_demo
          ./build/asan/algorithm_optimization_demo
          ./build/asan/thread_pool_demo
          ./build/asan/echo_server
          ./build/asan/http_server
          ./build/asan/serialization_benchmark
          ./build/asan/zmq_patterns_demo

  # ROS2 模块（条件编译）：官方 ROS 2 Humble 容器里构建并跑自测
  ros2:
    runs-on: ubuntu-24.04
    container:
      image: ros:humble
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y ninja-build protobuf-compiler libprotobuf-dev git

      - uses: actions/checkout@v4

      - name: Configure & build
        run: |
          source /opt/ros/humble/setup.bash
          cmake -G Ninja -B build-ros -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/opt/ros/humble -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-ros --target ros2_demo

      - name: Self test
        run: |
          source /opt/ros/humble/setup.bash
          timeout 30 ./build-ros/ros2_demo
